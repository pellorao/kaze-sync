{{define "content"}}
<div class="login"><form class="dlg" method="post" action="/login">
<div class="dlg-h"><span class="logo">{{icon "logo" "lg"}}kaze-sync</span></div>
<div class="dlg-b">
<div class="field"><label for="pw">{{t "login.password"}}</label><input id="pw" type="password" name="password" autofocus autocomplete="current-password">
{{if .Error}}<span class="err-msg">{{.Error}}</span>{{end}}
<span class="help">{{tm "login.help"}}</span></div>
</div>
<div class="dlg-f"><button class="btn primary">{{t "title.login"}}</button></div>
</form></div>
{{end}}
